  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:#05091a;overflow:hidden;}
  body{
    position:fixed;top:0;left:0;right:0;bottom:0;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    -webkit-user-select:none;user-select:none;
    overscroll-behavior:none;touch-action:none;
    font-family:"Songti SC","STSong","SimSun","Noto Serif SC",serif;

  #c{position:fixed;top:0;left:0;right:0;bottom:0;display:block;width:100%;height:100%;}
  .cap{
    position:fixed;left:0;right:0;bottom:11%;

    opacity:0;transform:translateY(14px);
    transition:opacity 2.2s ease,transform 2.2s ease;
  }
  .cap.show{opacity:1;transform:none;}
  .cap .cn{
    font-size:clamp(26px,8.2vw,44px);
    letter-spacing:.3em;margin-left:.3em;
    color:#fdf3d8;
    text-shadow:0 0 16px rgba(255,214,120,.55),0 0 40px rgba(255,180,80,.28);
  }
  .cap .en{
    margin-top:16px;
    font-size:clamp(9px,2.7vw,12px);
    letter-spacing:.36em;margin-left:.36em;
    color:#a9c2e6;opacity:.7;
    font-family:"Helvetica Neue",Arial,sans-serif;
  }
  .hint{
    position:fixed;left:0;right:0;
    top:calc(16px + env(safe-area-inset-top,0px));
    text-align:center;font-size:11px;letter-spacing:.2em;
    color:#9fb6d4;opacity:0;transition:opacity 1.4s ease;
    pointer-events:none;
    text-shadow:0 1px 6px rgba(5,10,25,.55);
  }
  .hint.show{opacity:.55;}
  .credit{
    position:fixed;left:0;right:0;bottom:2px;
    bottom:calc(2px + env(safe-area-inset-bottom,0px));
    text-align:center;font-size:8px;line-height:1;
    color:rgba(120,140,170,.45);pointer-events:none;
  }

<script>
(function(){
'use strict';

var TAU = Math.PI * 2;
var cvs = document.getElementById('c');
var ctx = cvs.getContext('2d');
var capEl = document.getElementById('cap');
var hintEl = document.getElementById('hint');

var W = 0, H = 0, DPR = 1;
var paint = null, pctx = null, moonBuf = null;
var strokes = [], revealed = 0, total = 0;
var stars = [], moon = null, horizon = 0;
var T = 0, lastT = 0, raf = 0, started = false, capShown = false;
var IMG_MODE = false, imgEl = null, imgFade = 0;
var dust = [], shooting = [], bursts = [];

function rand(a, b){ return a + Math.random() * (b - a); }
function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }
function pick(a){ return a[(Math.random() * a.length) | 0]; }

var PAL = {
  deep:  ['#07102b','#0a1636','#0d1c42','#111f4c'],
  mid:   ['#16306b','#1c3d80','#22498e','#2a559e'],
  light: ['#3a6cb4','#4a7fc6','#5d92d4','#7aa9e0','#9dc4ee'],
  glow:  ['#f7d879','#ffe9a6','#efc457','#fff4cf','#ffdf8a'],
  white: ['#e9f3ff','#cfe2f8','#b9d3f2','#ffffff'],
  hill:  ['#0c1a30','#102440','#142c4c','#0a1728','#183354'],
  cyp:   ['#0a1408','#101c0c','#16240f','#1d2c13','#26351a','#31421f'],
  vil:   ['#15161f','#1c1d28','#232433','#2a2b3a'],
  warm:  ['#ffcf6b','#ffdf95','#f7b84a','#ffe9b8']
};

/* ---------------- 画布 ---------------- */
function resize(){
  W = cvs.clientWidth || window.innerWidth;
  H = cvs.clientHeight || window.innerHeight;
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cvs.width = Math.round(W * DPR);
  cvs.height = Math.round(H * DPR);
  cvs.style.width = W + 'px';
  cvs.style.height = H + 'px';

  paint = document.createElement('canvas');
  paint.width = cvs.width;
  paint.height = cvs.height;
  pctx = paint.getContext('2d');
  pctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  build();
  revealed = 0;
  lastT = 0;
  glMode = false;
  gl = null;
  particleMode = false;
  pFade = 0;
  glCvs.className = '';
}

/* ---------------- 构图 ---------------- */
function hillBand(baseY, amp, c1, c2, seed){
  var i, x, y;
  pctx.beginPath();
  pctx.moveTo(-10, H + 10);
  for(x = -10; x <= W + 10; x += 12){
    y = baseY + Math.sin(x * 0.011 + seed) * amp + Math.sin(x * 0.031 + seed * 2.3) * amp * 0.42;
    pctx.lineTo(x, y);
  }
  pctx.lineTo(W + 10, H + 10);
  pctx.closePath();
  var g = pctx.createLinearGradient(0, baseY - amp, 0, baseY + H * 0.18);
  g.addColorStop(0, c1);
  g.addColorStop(1, c2);
  pctx.fillStyle = g;
  pctx.fill();

  /* 山丘上的笔触 */
  for(i = 0; i < W / 2.4; i++){
    var hx = rand(-10, W + 10);
    var hy = baseY + Math.sin(hx * 0.011 + seed) * amp + rand(0, H * 0.10);
    strokes.push(makeStroke(hx, hy, rand(4, 8), rand(3.2, 4.6), pick(PAL.hill), rand(1.4, 3.2), rand(0.35, 0.75)));
  }
}

function drawVillage(){
  var baseY = horizon + H * 0.022;
  var i, x, w, h, y;

  /* 村庄后的暖雾 */
  var bg = pctx.createRadialGradient(W * 0.5, baseY - H * 0.02, 0, W * 0.5, baseY - H * 0.02, W * 0.55);
  bg.addColorStop(0, 'rgba(150,120,70,0.16)');
  bg.addColorStop(1, 'rgba(150,120,70,0)');
  pctx.fillStyle = bg;
  pctx.fillRect(0, horizon - H * 0.09, W, H * 0.16);

  var n = 6;
  for(i = 0; i < n; i++){
    w = W * rand(0.12, 0.18);
    h = H * rand(0.036, 0.060);
    x = W * 0.14 + i * W * 0.125 + rand(-10, 10);
    y = baseY - h;
    pctx.fillStyle = pick(PAL.vil);
    pctx.fillRect(x, y, w, h);
    pctx.beginPath();
    pctx.moveTo(x - w * 0.06, y);
    pctx.lineTo(x + w * 0.5, y - h * 0.66);
    pctx.lineTo(x + w * 1.06, y);
    pctx.closePath();
    pctx.fill();

    /* 屋顶积雪 */
    pctx.strokeStyle = 'rgba(230,242,255,0.82)';
    pctx.lineWidth = Math.max(1.4, h * 0.10);
    pctx.lineCap = 'round';
    pctx.beginPath();
    pctx.moveTo(x - w * 0.03, y - 1);
    pctx.lineTo(x + w * 0.5, y - h * 0.63);
    pctx.lineTo(x + w * 1.03, y - 1);
    pctx.stroke();
    var wc = 2 + ((Math.random() * 2) | 0);
    for(var j = 0; j < wc; j++){
      var wx = x + w * (0.16 + j * 0.32) + rand(-2, 2);
      var wy = y + h * rand(0.30, 0.55);
      var ww = w * rand(0.11, 0.16);
      var wh = h * rand(0.22, 0.32);
      pctx.globalAlpha = 1;
      var gg = pctx.createRadialGradient(wx + ww / 2, wy + wh / 2, 0, wx + ww / 2, wy + wh / 2, ww * 4.2);
      gg.addColorStop(0, 'rgba(255,206,112,0.55)');
      gg.addColorStop(1, 'rgba(255,190,80,0)');
      pctx.fillStyle = gg;
      pctx.beginPath();
      pctx.arc(wx + ww / 2, wy + wh / 2, ww * 4.2, 0, TAU);
      pctx.fill();
      pctx.fillStyle = pick(PAL.warm);
      pctx.fillRect(wx, wy, ww, wh);
    }
    pctx.globalAlpha = 1;
  }

  /* 教堂尖顶 */
  var cx = W * 0.30, cy = baseY;
  pctx.fillStyle = '#1f2130';
  pctx.fillRect(cx - W * 0.022, cy - H * 0.070, W * 0.044, H * 0.070);
  pctx.beginPath();
  pctx.moveTo(cx - W * 0.030, cy - H * 0.070);
  pctx.lineTo(cx, cy - H * 0.125);
  pctx.lineTo(cx + W * 0.030, cy - H * 0.070);
  pctx.closePath();
  pctx.fill();
  pctx.fillStyle = 'rgba(255,214,130,0.85)';
  pctx.fillRect(cx - W * 0.006, cy - H * 0.040, W * 0.012, H * 0.014);
}

function buildMoonBuffer(){
  var pad = 2.6;
  var s = Math.ceil(moon.r * pad * 2 * DPR);
  moonBuf = document.createElement('canvas');
  moonBuf.width = s;
  moonBuf.height = s;
  var mc = moonBuf.getContext('2d');
  mc.setTransform(DPR, 0, 0, DPR, 0, 0);
  var cx = moon.r * pad, cy = moon.r * pad;

  var g = mc.createRadialGradient(cx, cy, 0, cx, cy, moon.r * 2.2);
  g.addColorStop(0, 'rgba(255,246,205,0.60)');
  g.addColorStop(0.35, 'rgba(255,220,130,0.20)');
  g.addColorStop(1, 'rgba(255,210,110,0)');
  mc.fillStyle = g;
  mc.beginPath();
  mc.arc(cx, cy, moon.r * 2.2, 0, TAU);
  mc.fill();

  var mg = mc.createRadialGradient(cx - moon.r * 0.25, cy - moon.r * 0.25, 0, cx, cy, moon.r);
  mg.addColorStop(0, '#fffdf0');
  mg.addColorStop(0.7, '#ffe9a8');
  mg.addColorStop(1, '#ffd979');
  mc.fillStyle = mg;
  mc.beginPath();
  mc.arc(cx, cy, moon.r, 0, TAU);
  mc.fill();

  mc.globalCompositeOperation = 'destination-out';
  mc.beginPath();
  mc.arc(cx - moon.r * 0.60, cy - moon.r * 0.32, moon.r * 0.96, 0, TAU);
  mc.fill();
}

function build(){
  horizon = H * 0.615;

  stars = [
    { x: W * 0.25, y: H * 0.33, r: W * 0.20, k: 2.8 },
    { x: W * 0.48, y: H * 0.50, r: W * 0.14, k: 2.2 },
    { x: W * 0.37, y: H * 0.09, r: W * 0.07, k: 1.8 },
    { x: W * 0.52, y: H * 0.24, r: W * 0.05, k: 1.5 }
  ];
  moon = { x: W * 0.87, y: H * 0.28, r: W * 0.098, k: 2.6 };

  /* 真实画作模式：直接把原图铺满 */
  if(IMG_MODE && imgEl){
    pctx.clearRect(0, 0, W, H);
    var iw = imgEl.naturalWidth || imgEl.width;
    var ih = imgEl.naturalHeight || imgEl.height;
    var sc = W / iw;
    var dh = ih * sc;
    var oy = (H - dh) / 2;

    pctx.fillStyle = '#050b1c';
    pctx.fillRect(0, 0, W, H);
    /* 背景：整图压暗铺满，上下留白处自然衔接 */
    pctx.globalAlpha = 0.55;
    try{ pctx.filter = 'blur(16px) brightness(0.7)'; }catch(e){}
    pctx.drawImage(imgEl, 0, 0, W, H);
    try{ pctx.filter = 'none'; }catch(e){}
    pctx.globalAlpha = 1;
    /* 前景：原比例按宽度铺满 */
    pctx.drawImage(imgEl, 0, oy, W, dh);
    if(oy > 2){
      var gt = pctx.createLinearGradient(0, 0, 0, oy + 40);
      gt.addColorStop(0, 'rgba(4,10,26,0.55)');
      gt.addColorStop(1, 'rgba(4,10,26,0)');
      pctx.fillStyle = gt;
      pctx.fillRect(0, 0, W, oy + 40);
    }

    strokes = [];
    total = 0;
    initFlowP();
    buildSnowSprite();
    initSnow();
    initStreaks();
    initTwinkles();
    dust = [];
    for(var k = 0; k < 42; k++){
      dust.push({ x: rand(0, W), y: rand(0, horizon), r: rand(0.7, 2.2), ph: rand(0, TAU), sp: rand(0.15, 0.5), vy: rand(-4, 4) });
    }
    return;
  }

  /* 底层铺色 */
  pctx.clearRect(0, 0, W, H);
  var g = pctx.createLinearGradient(0, 0, 0, horizon);
  g.addColorStop(0, '#0b1c46');
  g.addColorStop(0.5, '#14305f');
  g.addColorStop(1, '#1d4287');
  pctx.fillStyle = g;
  pctx.fillRect(0, 0, W, horizon + 2);

  pctx.fillStyle = '#0c1a30';
  pctx.fillRect(0, horizon, W, H - horizon);

  strokes = [];

  /* 山丘与村庄 */
  hillBand(horizon - H * 0.012, H * 0.020, '#173158', '#0e1f3a', 0.8);
  hillBand(horizon + H * 0.030, H * 0.026, '#12294c', '#091626', 2.6);
  drawVillage();
  hillBand(H * 0.795, H * 0.032, '#0f2038', '#06101f', 4.4);
  buildMoonBuffer();

  /* 天空笔触 */
  var skyN = Math.round((W * horizon) / 70);
  skyN = clamp(skyN, 1200, 2600);
  for(var i = 0; i < skyN; i++){
    var x = rand(-20, W + 20);
    var y = rand(-10, horizon + 10);
    strokes.push(makeStroke(x, y, rand(7, 13), rand(3.6, 5.6), skyTone(x, y), rand(1.8, 4.6), rand(0.5, 0.95)));
  }

  /* 山丘 / 村庄 */
  var hillN = Math.round(W / 1.4);
  for(i = 0; i < hillN; i++){
    var hx = rand(-10, W + 10);
    var hy = rand(horizon - H * 0.03, horizon + H * 0.09);
    strokes.push(makeStroke(hx, hy, rand(5, 9), rand(3.2, 4.8), pick(PAL.hill), rand(1.4, 3.4), rand(0.35, 0.8)));
  }

  /* 柏树的暗色轮廓 */
  pctx.beginPath();
  var cypTop = H * 0.13, cypBase = H * 1.02, cypCx = W * 0.105, cypW = W * 0.078;
  pctx.moveTo(cypCx - cypW, cypBase);
  for(var t1 = 0; t1 <= 1.001; t1 += 0.05){
    var yy = cypBase - (cypBase - cypTop) * t1;
    var ww = cypW * Math.pow(1 - t1, 0.55) + W * 0.006;
    var sway = Math.sin(t1 * 6.2) * W * 0.022 * t1;
    pctx.lineTo(cypCx + sway - ww, yy);
  }
  for(var t2 = 1; t2 >= -0.001; t2 -= 0.05){
    var yy2 = cypBase - (cypBase - cypTop) * t2;
    var ww2 = cypW * Math.pow(1 - t2, 0.55) + W * 0.006;
    var sway2 = Math.sin(t2 * 6.2) * W * 0.022 * t2;
    pctx.lineTo(cypCx + sway2 + ww2, yy2);
  }
  pctx.closePath();
  pctx.fillStyle = '#0a1209';
  pctx.fill();

  /* 柏树笔触 */
  var cypN = Math.round(W / 0.85);
  for(i = 0; i < cypN; i++){
    var cu = Math.pow(Math.random(), 0.62);
    var cy = cypBase - cu * (cypBase - cypTop);
    var spread = cypW * Math.pow(1 - cu, 0.55) + W * 0.006;
    var cxx = cypCx + Math.sin(cu * 6.2) * W * 0.022 * cu + rand(-spread, spread);
    strokes.push(makeStrokeCypress(cxx, cy, rand(5, 10), rand(3, 5.2), pick(PAL.cyp), rand(1.6, 4.0), rand(0.45, 0.9)));
  }

  /* 前景 */
  var fgN = Math.round(W / 1.6);
  for(i = 0; i < fgN; i++){
    var fx = rand(-10, W + 10);
    var fy = rand(H * 0.70, H + 10);
    strokes.push(makeStroke(fx, fy, rand(4, 8), rand(3, 4.5), pick(PAL.deep), rand(1.6, 3.6), rand(0.3, 0.7)));
  }

  total = strokes.length;
  initFlowP();
  buildSnowSprite();
  initSnow();
  initStreaks();
  initTwinkles();
  dust = [];
  for(i = 0; i < 42; i++){
    dust.push({ x: rand(0, W), y: rand(0, horizon), r: rand(0.7, 2.2), ph: rand(0, TAU), sp: rand(0.15, 0.5), vy: rand(-4, 4) });
  }
}

/* 天空取色：越靠近星星越黄 */
function skyTone(x, y){
  var best = 1e9, br = 100;
  for(var i = 0; i < stars.length; i++){
    var s = stars[i];
    var dx = x - s.x, dy = y - s.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    if(d < best){ best = d; br = s.r; }
  }
  if(moon){
    var mx = x - moon.x, my = y - moon.y;
    var md = Math.sqrt(mx * mx + my * my);
    if(md < best){ best = md; br = moon.r; }
  }
  var f = clamp(1 - best / (br * 2.6), 0, 1);
  var r = Math.random();
  if(f > 0.55 && r < 0.85) return pick(PAL.white);
  if(f > 0.28 && r < 0.75) return pick(PAL.glow);
  if(f > 0.12 && r < 0.45) return pick(PAL.light);
  if(y > horizon * 0.72) return pick(PAL.mid);
  if(y < horizon * 0.25) return pick(PAL.deep);
  return Math.random() < 0.45 ? pick(PAL.mid) : pick(PAL.deep);
}

/* ---------------- 流场 ---------------- */
function flow(x, y){
  var vx = 0.62, vy = -0.16;
  var i, s, dx, dy, r, k;
  for(i = 0; i < stars.length; i++){
    s = stars[i];
    dx = x - s.x; dy = y - s.y;
    r = Math.sqrt(dx * dx + dy * dy) + 26;
    k = s.k * (s.r * 1.6) / r;
    vx += (dy / r) * k;
    vy += (-dx / r) * k;
  }
  if(moon){
    dx = x - moon.x; dy = y - moon.y;
    r = Math.sqrt(dx * dx + dy * dy) + 26;
    k = moon.k * (moon.r * 1.5) / r;
    vx += (dy / r) * k;
    vy += (-dx / r) * k;
  }
  var m = Math.sqrt(vx * vx + vy * vy) || 1;
  return [vx / m, vy / m];
}

function makeStroke(x, y, steps, stepLen, color, w, alpha){
  var pts = [x, y];
  for(var i = 0; i < steps; i++){
    var d = flow(x, y);
    x += d[0] * stepLen;
    y += d[1] * stepLen;
    pts.push(x, y);
  }
  return { p: pts, c: color, w: w, a: alpha };
}

function makeStrokeCypress(x, y, steps, stepLen, color, w, alpha){
  var pts = [x, y];
  for(var i = 0; i < steps; i++){
    var sway = Math.sin(y * 0.02 + T) * 0.55;
    x += sway * stepLen * 0.6 + rand(-0.4, 0.4);
    y -= stepLen;
    pts.push(x, y);
  }
  return { p: pts, c: color, w: w, a: alpha };
}

/* ---------------- 绘制 ---------------- */
function drawStroke(s){
  var p = s.p;
  pctx.beginPath();
  pctx.moveTo(p[0], p[1]);
  for(var i = 2; i < p.length; i += 2) pctx.lineTo(p[i], p[i + 1]);
  pctx.strokeStyle = s.c;
  pctx.globalAlpha = s.a;
  pctx.lineWidth = s.w;
  pctx.lineCap = 'round';
  pctx.lineJoin = 'round';
  pctx.stroke();
  pctx.globalAlpha = 1;
}

function revealStep(n){
  var end = Math.min(total, revealed + n);
  for(var i = revealed; i < end; i++) drawStroke(strokes[i]);
  revealed = end;
  if(end > 0) revealY = strokes[end - 1].p[1];
}

/* 星星的光环 */
function drawStar(s, t){
  var pulse = 0.72 + 0.28 * Math.sin(t * 1.1 + s.x * 0.01);
  ctx.globalCompositeOperation = 'lighter';
  var g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 2.6);
  g.addColorStop(0, 'rgba(255,244,205,' + (0.50 * pulse) + ')');
  g.addColorStop(0.30, 'rgba(255,216,125,' + (0.20 * pulse) + ')');
  g.addColorStop(0.65, 'rgba(255,200,95,' + (0.07 * pulse) + ')');
  g.addColorStop(1, 'rgba(255,200,90,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(s.x, s.y, s.r * 2.6, 0, TAU);
  ctx.fill();

  ctx.globalAlpha = 0.20 * pulse;
  ctx.fillStyle = '#fff6d6';
  ctx.beginPath();
  ctx.arc(s.x, s.y, s.r * 0.55, 0, TAU);
  ctx.fill();

  /* 柔和的同心光环，像画里的星星那样一圈圈晕开 */
  for(var i = 1; i <= 3; i++){
    var rr = s.r * (0.95 + i * 0.62);
    ctx.globalAlpha = (0.16 - i * 0.038) * pulse;
    ctx.strokeStyle = 'rgba(255,234,168,1)';
    ctx.lineWidth = Math.max(1.4, s.r * (0.20 - i * 0.04));
    ctx.beginPath();
    ctx.arc(s.x, s.y, rr, 0, TAU);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawMoon(t){
  if(!moonBuf) return;
  var m = moon;
  var pulse = 0.86 + 0.14 * Math.sin(t * 0.9);
  var pad = 2.6;
  var size = m.r * pad * 2;

  ctx.globalCompositeOperation = 'lighter';
  var g = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, m.r * 3.2);
  g.addColorStop(0, 'rgba(255,244,200,' + (0.30 * pulse) + ')');
  g.addColorStop(0.45, 'rgba(255,214,120,' + (0.10 * pulse) + ')');
  g.addColorStop(1, 'rgba(255,205,100,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(m.x, m.y, m.r * 3.2, 0, TAU);
  ctx.fill();

  ctx.globalAlpha = 0.94;
  ctx.drawImage(moonBuf, m.x - size / 2, m.y - size / 2, size, size);
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawMoonGlow(){
  var pulse = 0.82 + 0.18 * Math.sin(T * 0.85);
  ctx.globalCompositeOperation = 'lighter';
  var g = ctx.createRadialGradient(moon.x, moon.y, moon.r * 0.35, moon.x, moon.y, moon.r * 2.8);
  g.addColorStop(0, 'rgba(255,245,190,' + (0.34 * pulse) + ')');
  g.addColorStop(0.35, 'rgba(255,222,132,' + (0.15 * pulse) + ')');
  g.addColorStop(0.7, 'rgba(255,210,110,' + (0.05 * pulse) + ')');
  g.addColorStop(1, 'rgba(255,205,100,0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(moon.x, moon.y, moon.r * 2.8, 0, TAU);
  ctx.fill();
  ctx.globalCompositeOperation = 'source-over';
}

function drawDust(t){
  ctx.globalCompositeOperation = 'lighter';
  for(var i = 0; i < dust.length; i++){
    var d = dust[i];
    var y = d.y + Math.sin(t * 0.3 + d.ph) * 10;
    var x = d.x + Math.cos(t * 0.22 + d.ph) * 12;
    var a = 0.18 + 0.22 * Math.sin(t * 1.3 + d.ph);
    if(a <= 0) continue;
    ctx.globalAlpha = a;
    ctx.fillStyle = '#ffe9b0';
    ctx.beginPath();
    ctx.arc(x, y, d.r, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function drawShooting(){
  for(var i = shooting.length - 1; i >= 0; i--){
    var s = shooting[i];
    s.t += 1;
    var k = s.t / s.life;
    if(k >= 1){ shooting.splice(i, 1); continue; }
    var x = s.x0 + (s.x1 - s.x0) * k;
    var y = s.y0 + (s.y1 - s.y0) * k;
    ctx.globalCompositeOperation = 'lighter';
    for(var j = 0; j < 10; j++){
      var kk = k - j * 0.028;
      if(kk < 0) continue;
      var px = s.x0 + (s.x1 - s.x0) * kk;
      var py = s.y0 + (s.y1 - s.y0) * kk;
      ctx.globalAlpha = (1 - j / 10) * (1 - k) * 0.7;
      ctx.fillStyle = '#fff3c8';
      ctx.beginPath();
      ctx.arc(px, py, (1 - j / 11) * 2.6, 0, TAU);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
}

function drawBursts(dt){
  for(var i = bursts.length - 1; i >= 0; i--){
    var b = bursts[i];
    b.t += dt;
    if(b.t > b.life){ bursts.splice(i, 1); continue; }
    var k = b.t / b.life;
    for(var j = 0; j < b.parts.length; j++){
      var p = b.parts[j];
      var x = b.x + p.vx * b.t * 60;
      var y = b.y + p.vy * b.t * 60 + 40 * b.t * b.t;
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = (1 - k) * 0.8;
      ctx.fillStyle = '#ffe9a8';
      ctx.beginPath();
      ctx.arc(x, y, p.r * (1 - k * 0.6), 0, TAU);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* ---------------- 烟花与流粒子 ---------------- */
var shells = [], sparks = [], flowP = [], nextFw = 3.0, revealY = 0, snowAcc = 0;
var FW_GOLD = ['#ffd979', '#ffe9a6', '#ffc94a', '#fff6d6'];
var FW_BLUE = ['#7aa9e0', '#9dc4ee', '#4a7fc6', '#cfe0ff'];
var FW_WHITE = ['#ffffff', '#eef6ff', '#dfeaff', '#f4f9ff'];
var FW_MIX = FW_GOLD.concat(FW_BLUE, FW_WHITE);

function pickPal(){
  var r = Math.random();
  if(r < 0.30) return FW_BLUE;
  if(r < 0.58) return FW_GOLD;
  if(r < 0.74) return FW_WHITE;
  return FW_MIX;
}

var glowWarm = null, glowCool = null;

function makeGlow(rgb, size){
  var s = size || 64;
  var c = document.createElement('canvas');
  c.width = s;
  c.height = s;
  var g = c.getContext('2d');
  var rg = g.createRadialGradient(s / 2, s / 2, 0, s / 2, s / 2, s / 2);
  rg.addColorStop(0, 'rgba(' + rgb + ',1)');
  rg.addColorStop(0.22, 'rgba(' + rgb + ',0.55)');
  rg.addColorStop(0.55, 'rgba(' + rgb + ',0.16)');
  rg.addColorStop(1, 'rgba(' + rgb + ',0)');
  g.fillStyle = rg;
  g.beginPath();
  g.arc(s / 2, s / 2, s / 2, 0, TAU);
  g.fill();
  return c;
}

function initFlowP(){
  glowWarm = makeGlow('255,232,164');
  glowCool = makeGlow('205,228,255');
  flowP = [];
  for(var i = 0; i < 500; i++){
    var warm = Math.random() < 0.42;
    flowP.push({
      x: rand(0, W), y: rand(-30, H * 0.94),
      life: rand(0, 6), max: rand(7, 16),
      r: rand(1.1, 3.4),
      sp: rand(7, 19),
      ph: rand(0, TAU),
      sw: rand(0.25, 0.75),
      warm: warm,
      a: rand(0.22, 0.55)
    });
  }
}

function stepFlowP(dt){
  ctx.globalCompositeOperation = 'lighter';
  for(var i = 0; i < flowP.length; i++){
    var p = flowP[i];
    p.life += dt;
    var d = flow(p.x, p.y);
    p.x += (d[0] * p.sp + Math.sin(T * p.sw + p.ph) * 5) * dt;
    p.y += (d[1] * p.sp + Math.cos(T * p.sw * 0.82 + p.ph) * 4) * dt;
    if(p.life > p.max || p.x < -40 || p.x > W + 40 || p.y < -50 || p.y > H * 0.99){
      p.x = rand(-20, W + 20);
      p.y = rand(-40, H * 0.9);
      p.life = 0;
      p.max = rand(7, 16);
      p.ph = rand(0, TAU);
    }
    var fade = Math.sin(Math.PI * clamp(p.life / p.max, 0, 1));
    var tw = 0.62 + 0.38 * Math.sin(T * p.sw * 2.4 + p.ph * 2);
    var a = p.a * fade * tw;
    if(a <= 0.01) continue;
    var sz = p.r * 6.5;
    ctx.globalAlpha = a;
    ctx.drawImage(p.warm ? glowWarm : glowCool, p.x - sz / 2, p.y - sz / 2, sz, sz);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

function launchShell(x0){
  var sx = (x0 === undefined) ? rand(W * 0.10, W * 0.90) : x0;
  var pal = pickPal();
  shells.push({
    x: sx, y: horizon + rand(-4, 16),
    tx: sx + rand(-W * 0.10, W * 0.10), ty: rand(H * 0.08, H * 0.42),
    t: 0, col: pal[0], pal: pal
  });
}

function stepShells(dt){
  for(var i = shells.length - 1; i >= 0; i--){
    var s = shells[i];
    s.t += dt;
    s.x += (s.tx - s.x) * 2.2 * dt;
    s.y += (s.ty - s.y) * 3.0 * dt;
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.85;
    ctx.fillStyle = s.col;
    ctx.beginPath();
    ctx.arc(s.x, s.y, 2.2, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 0.28;
    ctx.beginPath();
    ctx.arc(s.x, s.y + 9, 1.3, 0, TAU);
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    if(s.t > 0.92 || Math.abs(s.y - s.ty) < 6){
      explode(s.x, s.y, s.pal || FW_MIX);
      shells.splice(i, 1);
    }
  }
}

function explode(x, y, pal){
  if(!pal || !pal.length) pal = FW_MIX;
  var n = 78 + ((Math.random() * 52) | 0);
  for(var i = 0; i < n; i++){
    var a = (i / n) * TAU + rand(-0.06, 0.06);
    var sp = rand(110, 320);
    if(Math.random() < 0.3) sp *= Math.pow(Math.random(), 0.5);
    sparks.push({
      x: x, y: y, px: x, py: y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      g: rand(95, 150), drag: 0.968,
      life: rand(0.9, 1.8), t: 0,
      col: pal[(Math.random() * pal.length) | 0],
      r: rand(0.9, 2.2)
    });
  }
  bursts.push({ x: x, y: y, t: 0, life: 0.42, parts: [{ vx: 0, vy: 0, r: 6 }] });
}

function drawSparks(dt){
  ctx.globalCompositeOperation = 'lighter';
  for(var i = sparks.length - 1; i >= 0; i--){
    var s = sparks[i];
    s.t += dt;
    if(s.t >= s.life){ sparks.splice(i, 1); continue; }
    s.px = s.x; s.py = s.y;
    s.vy += s.g * dt;
    var dr = Math.pow(s.drag, dt * 60);
    s.vx *= dr;
    s.vy *= dr;
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    var k = 1 - s.t / s.life;
    ctx.globalAlpha = k * 0.9;
    ctx.strokeStyle = s.col;
    ctx.lineWidth = s.r * (0.45 + k * 0.85);
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(s.px, s.py);
    ctx.lineTo(s.x, s.y);
    ctx.stroke();
    ctx.globalAlpha = k * 0.45;
    ctx.fillStyle = s.col;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r * 1.1, 0, TAU);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* ---------------- 音乐（同目录 music.mp3，存在就播） ---------------- */
var AC = null, musicBuf = null, musicOn = false, musicGain = null;

function loadMusic(){
  try{
    fetch('music.mp3', { cache: 'force-cache' }).then(function(r){
      if(!r.ok) throw new Error('none');
      return r.arrayBuffer();
    }).then(function(ab){
      var Ctx = window.AudioContext || window.webkitAudioContext;
      if(!Ctx) return;
      AC = new Ctx();
      return AC.decodeAudioData(ab).then(function(b){ musicBuf = b; });
    }).catch(function(){});
  }catch(e){}
}

function startMusic(){
  if(!musicBuf || musicOn || !AC) return;
  try{
    if(AC.state === 'suspended') AC.resume();
    var s = AC.createBufferSource();
    s.buffer = musicBuf;
    s.loop = true;
    musicGain = AC.createGain();
    musicGain.gain.setValueAtTime(0.0001, AC.currentTime);
    musicGain.gain.linearRampToValueAtTime(0.62, AC.currentTime + 3.2);
    s.connect(musicGain);
    musicGain.connect(AC.destination);
    s.start(0);
    musicOn = true;
  }catch(e){}
}

/* ---------------- 风雪 ---------------- */
var snow = [], streaks = [], snowSprite = null;
var gustTimer = 5.0, gustT = -1, gustLevel = 0;

  c.arc(s / 2, s / 2, s / 2, 0, TAU);

function makeFlake(layer){

function initSnow(){

  for(i = 0; i < 58; i++) snow.push(makeFlake(2));
}

function initStreaks(){
  streaks = [];
  for(var i = 0; i < 26; i++){
    streaks.push({ x: rand(0, W), y: rand(0, H * 0.92), len: rand(40, 120) });
  }
}

function stepGust(dt){
  if(gustT >= 0){
    gustT += dt;
    if(gustT > 1.9) gustT = -1;
    gustLevel = gustT >= 0 ? Math.sin(Math.PI * clamp(gustT / 1.9, 0, 1)) : 0;
  } else {
    gustLevel = 0;
    gustTimer -= dt;
    if(gustTimer <= 0){ gustTimer = rand(7, 12); gustT = 0; }
  }
}

function stepSnow(dt){
  stepGust(dt);
  var windX = 10 + gustLevel * 92;
  for(var i = 0; i < snow.length; i++){
    var f = snow[i];
    var d = flow(f.x, f.y);
    f.x += (d[0] * f.tw + windX + Math.sin(T * f.sw + f.ph) * 13) * dt;
    f.y += (f.sp + d[1] * f.tw * 0.5 + Math.cos(T * f.sw * 0.8 + f.ph) * 7) * dt;
    if(f.y > H + 14 || f.x > W + 44 || f.x < -44){
      f.x = rand(-30, W + 30);
      f.y = rand(-H * 0.22, -12);
      f.ph = rand(0, TAU);
    }
  }
  for(i = 0; i < streaks.length; i++){
    var s = streaks[i];
    var dd = flow(s.x, s.y);
    var v = (70 + gustLevel * 260) * dt;
    s.x += dd[0] * v;
    s.y += dd[1] * v + 26 * dt;
    if(s.x > W + 70 || s.y > H + 50 || s.x < -70){
      s.x = rand(-70, W * 0.45);
      s.y = rand(-30, H * 0.85);
      s.len = rand(40, 120);
    }
  }
}

function drawSnow(){
  var i, f, s;
  ctx.globalCompositeOperation = 'lighter';

  if(gustLevel > 0.02){
    ctx.strokeStyle = '#dbeaff';
    ctx.lineCap = 'round';
    for(i = 0; i < streaks.length; i++){
      s = streaks[i];
      var dd = flow(s.x, s.y);
      ctx.globalAlpha = gustLevel * 0.13;
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      ctx.lineTo(s.x - dd[0] * s.len, s.y - dd[1] * s.len);
      ctx.stroke();
    }
  }

  for(i = 0; i < snow.length; i++){
    f = snow[i];
    ctx.globalAlpha = f.a;
    if(f.layer === 2 && snowSprite){
      var sz = f.r * 4.2;
      ctx.drawImage(snowSprite, f.x - sz / 2, f.y - sz / 2, sz, sz);
    } else {
      ctx.fillStyle = '#e8f2ff';
      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, TAU);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* 积雪堆 */
function drawSnowBank(dt){
  if(revealed < total * 0.5) return;
  snowAcc = Math.min(1, snowAcc + dt * 0.07);
  var top = H * 0.948 - H * 0.040 * snowAcc;
  var x, y;
  ctx.beginPath();
  ctx.moveTo(-10, H + 10);
  for(x = -10; x <= W + 10; x += 9){
    y = top + Math.sin(x * 0.010 + 1.4) * 7 + Math.sin(x * 0.027 + 0.6) * 4;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W + 10, H + 10);
  ctx.closePath();
  var g = ctx.createLinearGradient(0, top - 8, 0, H);
  g.addColorStop(0, 'rgba(232,244,255,' + (0.96 * snowAcc) + ')');
  g.addColorStop(0.35, 'rgba(190,216,246,' + (0.92 * snowAcc) + ')');
  g.addColorStop(1, 'rgba(128,170,216,' + (0.88 * snowAcc) + ')');
  ctx.fillStyle = g;
  ctx.fill();

  ctx.beginPath();
  for(x = -10; x <= W + 10; x += 9){
    y = top + Math.sin(x * 0.010 + 1.4) * 7 + Math.sin(x * 0.027 + 0.6) * 4;
    if(x === -10) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.strokeStyle = 'rgba(255,255,255,' + (0.6 * snowAcc) + ')';
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

/* 把天空按横条沿流场错位，让画面像流体一样起伏（地面保持稳定） */
/* 整幅画缓慢摆动 + 轻微缩放，像还活着的画 */
function drawWarped(driftX, driftY){
  var ang = Math.sin(T * 0.15) * 0.0055;
  var sc = 1.014 + 0.010 * Math.sin(T * 0.105 + 1.1);
  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.rotate(ang);
  ctx.scale(sc, sc);
  ctx.drawImage(paint, -W / 2 + driftX, -H / 2 + driftY, W, H);
  ctx.restore();
}

/* ---------------- WebGL 流体扭曲 ---------------- */
var glCvs = document.getElementById('gl');
var gl = null, glTex = null, glMode = false, glU = {};

function initGL(){
  try{
    glCvs.width = Math.round(W * DPR);
    glCvs.height = Math.round(H * DPR);
    glCvs.style.width = W + 'px';
    glCvs.style.height = H + 'px';
    var g = glCvs.getContext('webgl', { antialias: false, alpha: false, depth: false, stencil: false });
    if(!g) return false;
    var vs = 'attribute vec2 aPos; void main(){ gl_Position = vec4(aPos, 0.0, 1.0); }';
    var fs = [
      'precision mediump float;',
      'uniform sampler2D uTex;',
      'uniform vec2 uRes;',
      'uniform float uTime;',
      'uniform float uDpr;',
      'uniform vec3 uStars[5];',
      'void main(){',
      '  vec2 p = gl_FragCoord.xy / uDpr;',
      '  vec2 v = vec2(0.62, -0.16);',
      '  float wsum = 0.0;',
      '  float asum = 0.0;',
      '  for(int i = 0; i < 5; i++){',
      '    vec2 d = p - uStars[i].xy;',
      '    float r = length(d) + 26.0;',
      '    float k = uStars[i].z * 46.0 / r;',
      '    v += vec2(d.y, -d.x) / r * k;',
      '    float w = 1.0 / (r * r * 0.00002 + 1.0);',
      '    wsum += w;',
      '    asum += atan(d.y, d.x) * w;',
      '  }',
      '  v = normalize(v);',
      '  float ang = asum / max(wsum, 0.001);',
      '  float ph = sin(uTime * 0.75 + ang * 1.7 + p.x * 0.004 + p.y * 0.003);',
      '  vec2 off = v * ph * 2.6 / (uRes / uDpr);',
      '  vec3 col = texture2D(uTex, gl_FragCoord.xy / uRes + off).rgb;',
      '  gl_FragColor = vec4(col, 1.0);',
      '}'
    ].join('\n');
    function sh(type, src){
      var s = g.createShader(type);
      g.shaderSource(s, src);
      g.compileShader(s);
      if(!g.getShaderParameter(s, g.COMPILE_STATUS)) return null;
      return s;
    }
    var v = sh(g.VERTEX_SHADER, vs), f = sh(g.FRAGMENT_SHADER, fs);
    if(!v || !f) return false;
    var pr = g.createProgram();
    g.attachShader(pr, v);
    g.attachShader(pr, f);
    g.linkProgram(pr);
    if(!g.getProgramParameter(pr, g.LINK_STATUS)) return false;
    g.useProgram(pr);
    var buf = g.createBuffer();
    g.bindBuffer(g.ARRAY_BUFFER, buf);
    g.bufferData(g.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), g.STATIC_DRAW);
    var aPos = g.getAttribLocation(pr, 'aPos');
    g.enableVertexAttribArray(aPos);
    g.vertexAttribPointer(aPos, 2, g.FLOAT, false, 0, 0);
    glTex = g.createTexture();
    g.bindTexture(g.TEXTURE_2D, glTex);
    g.texParameteri(g.TEXTURE_2D, g.TEXTURE_WRAP_S, g.CLAMP_TO_EDGE);
    g.texParameteri(g.TEXTURE_2D, g.TEXTURE_WRAP_T, g.CLAMP_TO_EDGE);
    g.texParameteri(g.TEXTURE_2D, g.TEXTURE_MIN_FILTER, g.LINEAR);
    g.texParameteri(g.TEXTURE_2D, g.TEXTURE_MAG_FILTER, g.LINEAR);
    g.pixelStorei(g.UNPACK_FLIP_Y_WEBGL, true);
    g.viewport(0, 0, glCvs.width, glCvs.height);
    glU = {
      tex: g.getUniformLocation(pr, 'uTex'),
      res: g.getUniformLocation(pr, 'uRes'),
      time: g.getUniformLocation(pr, 'uTime'),
      dpr: g.getUniformLocation(pr, 'uDpr'),
      stars: g.getUniformLocation(pr, 'uStars')
    };
    gl = g;
    return true;
  }catch(e){ return false; }
}

function startGL(){
  if(glMode) return;
  if(!initGL()) return;
  try{
    gl.bindTexture(gl.TEXTURE_2D, glTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, paint);
  }catch(e){ return; }
  glMode = true;
  glCvs.className = 'on';
}

var glArr = new Float32Array(15);
function drawGL(){
  if(!glMode || !gl) return;
  var i;
  for(i = 0; i < 4; i++){
    glArr[i * 3] = stars[i].x;
    glArr[i * 3 + 1] = H - stars[i].y;
    glArr[i * 3 + 2] = stars[i].k * 0.55;
  }
  glArr[12] = moon.x;
  glArr[13] = H - moon.y;
  glArr[14] = moon.k * 0.55;
  gl.uniform1i(glU.tex, 0);
  gl.uniform2f(glU.res, glCvs.width, glCvs.height);
  gl.uniform1f(glU.dpr, DPR);
  gl.uniform1f(glU.time, T);
  gl.uniform3fv(glU.stars, glArr);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}

/* ---------------- 画面化为粒子 ---------------- */
var particles = [], particleMode = false, pFade = 0;

function buildParticles(){
  particles = [];
  var img = pctx.getImageData(0, 0, paint.width, paint.height).data;
  var step = Math.max(6, Math.round(7 * DPR));
  var pw = paint.width;
  var cell = step / DPR;
  for(var y = 0; y < paint.height; y += step){
    for(var x = 0; x < pw; x += step){
      var i4 = (y * pw + x) * 4;
      var r = img[i4], g = img[i4 + 1], b = img[i4 + 2];
      if(r + g + b < 26) continue;
      var jx = rand(-cell * 0.34, cell * 0.34);
      var jy = rand(-cell * 0.34, cell * 0.34);
      var al = 0.55 + Math.random() * 0.45;
      var cx = (x + jx * DPR) / DPR, cy = (y + jy * DPR) / DPR;
      particles.push({
        hx: cx, hy: cy, x: cx, y: cy,
        vx: 0, vy: 0,
        c: 'rgba(' + r + ',' + g + ',' + b + ',' + al.toFixed(2) + ')',
        sz: cell * (0.55 + Math.random() * 0.55),
        ph: rand(0, TAU)
      });
    }
  }
}

function startParticles(){
  return;
  if(particleMode) return;
  try{ buildParticles(); }catch(e){ return; }
  if(!particles.length) return;
  particleMode = true;
  pFade = 0;
}

function stepParticles(dt){
  var i, p, d, wob;
  var damp = Math.pow(0.90, dt * 60);
  for(i = 0; i < particles.length; i++){
    p = particles[i];
    d = flow(p.x, p.y);
    wob = 0.55 + 0.45 * Math.sin(T * 0.42 + p.ph);
    p.vx += (p.hx - p.x) * 3.0 * dt + d[0] * 44 * wob * dt;
    p.vy += (p.hy - p.y) * 3.0 * dt + d[1] * 27 * wob * dt;
    p.vx *= damp;
    p.vy *= damp;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
  for(i = 0; i < particles.length; i++){
    p = particles[i];
    ctx.fillStyle = p.c;
    ctx.fillRect(p.x - p.sz * 0.5, p.y - p.sz * 0.5, p.sz, p.sz);
  }
  /* 少量粒子带柔光，像星点在闪 */
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = 0.20 * pFade;
  for(i = 0; i < particles.length; i += 11){
    p = particles[i];
    ctx.drawImage(glowWarm, p.x - 4.5, p.y - 4.5, 9, 9);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* ---------------- 星星闪烁 ---------------- */
var twinkles = [];

function initTwinkles(){
  twinkles = [];
  for(var i = 0; i < 110; i++){
    twinkles.push({
      x: rand(0, W), y: rand(-10, H * 0.92),
      t: rand(0, 4), life: rand(1.6, 3.8), delay: rand(0, 3),
      s: rand(1.8, 5.6), warm: Math.random() < 0.58
    });
  }
}

function stepTwinkles(dt){
  ctx.globalCompositeOperation = 'lighter';
  for(var i = 0; i < twinkles.length; i++){
    var p = twinkles[i];
    if(p.delay > 0){ p.delay -= dt; continue; }
    p.t += dt;
    if(p.t > p.life){
      p.t = 0;
      p.life = rand(1.6, 3.8);
      p.x = rand(0, W);
      p.y = rand(-10, H * 0.92);
      p.s = rand(1.8, 5.6);
      p.warm = Math.random() < 0.58;
      p.delay = rand(0.15, 2.4);
      continue;
    }
    var k = Math.sin(Math.PI * p.t / p.life);
    if(k <= 0.02) continue;
    var sz = p.s * 5.5;
    ctx.globalAlpha = k * 0.55;
    ctx.drawImage(p.warm ? glowWarm : glowCool, p.x - sz / 2, p.y - sz / 2, sz, sz);

    if(p.s > 3.6){
      var L = p.s * 2.1;
      ctx.globalAlpha = k * 0.45;
      ctx.strokeStyle = p.warm ? 'rgba(255,236,170,1)' : 'rgba(214,232,255,1)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(p.x - L, p.y);
      ctx.lineTo(p.x + L, p.y);
      ctx.moveTo(p.x, p.y - L);
      ctx.lineTo(p.x, p.y + L);
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/* ---------------- 主循环 ---------------- */
function frame(now){
  raf = requestAnimationFrame(frame);
  if(!W || !H) return;
  if(!lastT) lastT = now;
  var dt = (now - lastT) / 1000;
  lastT = now;
  if(dt > 0.1) dt = 0.1;
  if(dt < 0) dt = 0;
  T += dt;

  /* 真实画作模式：先淡入，再化成粒子 */
  if(IMG_MODE && total === 0){
    imgFade = Math.min(1, imgFade + dt / 1.4);
    if(imgFade >= 1 && !capShown){
      capShown = true;
      startParticles();
      capEl.className = 'cap show';
      setTimeout(function(){ hintEl.className = 'hint show'; }, 1400);
    }
  } else if(revealed < total){
    var prog = revealed / total;
    var speed = 16 + 46 * Math.sin(Math.PI * clamp(prog, 0, 1));
    revealStep(Math.max(6, Math.round(speed)));
  } else if(!capShown){
    capShown = true;
    startParticles();
    capEl.className = 'cap show';
    setTimeout(function(){ hintEl.className = 'hint show'; }, 1400);
  }

  var drift = Math.sin(T * 0.09) * 5;
  var driftY = Math.cos(T * 0.07) * 3;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  if(particleMode){
    pFade = Math.min(1, pFade + dt * 0.9);
    ctx.fillStyle = '#05091a';
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = 0.52 * (1 - pFade * 0.30);
    drawWarped(drift, driftY);
    ctx.globalAlpha = pFade;
    stepParticles(dt);
    ctx.globalAlpha = 1;
  } else if(glMode){
    ctx.clearRect(0, 0, W, H);
    drawGL();
  } else {
    ctx.fillStyle = '#05091a';
    ctx.fillRect(0, 0, W, H);
    if(revealed > 0 || (IMG_MODE && total === 0)){
      ctx.globalAlpha = IMG_MODE ? imgFade : 1;
      drawWarped(drift, driftY);
      ctx.globalAlpha = 1;
    }
  }
  drawSnowBank(dt);

  /* 村庄灯火呼吸 */
  if(revealed > total * 0.55){
    var wg = 0.045 + 0.030 * Math.sin(T * 1.6) + 0.018 * Math.sin(T * 3.9 + 1.2);
    var grd = ctx.createRadialGradient(W * 0.5, horizon + H * 0.02, 0, W * 0.5, horizon + H * 0.02, W * 0.62);
    grd.addColorStop(0, 'rgba(255,198,112,' + wg + ')');
    grd.addColorStop(1, 'rgba(255,190,90,0)');
    ctx.globalCompositeOperation = 'lighter';
    ctx.fillStyle = grd;
    ctx.fillRect(0, horizon - H * 0.09, W, H * 0.22);
    ctx.globalCompositeOperation = 'source-over';
  }

  /* 铺色推进时的光带 */
  if(revealed < total && revealY > 0){
    ctx.globalCompositeOperation = 'lighter';
    var sw = ctx.createLinearGradient(0, revealY - 76, 0, revealY + 76);
    sw.addColorStop(0, 'rgba(255,220,140,0)');
    sw.addColorStop(0.5, 'rgba(255,226,150,0.13)');
    sw.addColorStop(1, 'rgba(255,220,140,0)');
    ctx.fillStyle = sw;
    ctx.fillRect(0, revealY - 76, W, 152);
    ctx.globalCompositeOperation = 'source-over';
  }

  if(revealed > total * 0.45 || (IMG_MODE && total === 0 && imgFade > 0.05)){
    stepFlowP(dt);
    if(!IMG_MODE){
      for(var i = 0; i < stars.length; i++) drawStar(stars[i], T);
      drawMoon(T);
    } else {
      drawMoonGlow();
    }
    drawDust(T);
    stepShells(dt);
    drawSparks(dt);
    drawShooting();
    drawBursts(dt);
    stepTwinkles(dt);
    stepSnow(dt);
    drawSnow();
  }

  if(revealed >= total){
    nextFw -= dt;
    if(nextFw <= 0){
      nextFw = rand(3.2, 5.8);
      launchShell();
      if(Math.random() < 0.5){
        setTimeout(function(){ if(revealed >= total) launchShell(); }, 300);
      }
    }
  }
}

/* ---------------- 交互 ---------------- */
function tap(x, y){
  if(!musicOn) startMusic();
  if(revealed < total * 0.6) return;
  explode(x, y, pickPal());
  if(Math.random() < 0.4) launchShell();

  if(Math.random() < 0.6){
    var sx = rand(W * 0.1, W * 0.8);
    shooting.push({
      x0: sx, y0: rand(H * 0.05, H * 0.22),
      x1: sx + rand(80, 190), y1: rand(H * 0.22, H * 0.40),
      t: 0, life: rand(24, 38)
    });
  }
}

function onDown(e){
  var x, y;
  if(e && e.touches && e.touches.length){ x = e.touches[0].clientX; y = e.touches[0].clientY; }
  else if(e){ x = e.clientX; y = e.clientY; }
  if(x === undefined) return;
  tap(x, y);
}
var DOWNEVT = window.PointerEvent ? 'pointerdown' : 'touchstart';
document.addEventListener(DOWNEVT, onDown, { passive: true });
if(!window.PointerEvent) document.addEventListener('mousedown', onDown, { passive: true });
document.addEventListener('touchmove', function(e){
  if(e.touches && e.touches.length > 1) e.preventDefault();
}, { passive: false });
document.addEventListener('dblclick', function(e){ e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', function(e){ e.preventDefault(); }, { passive: false });

/* ---------------- 生命周期 ---------------- */
var rt = 0;
function scheduleResize(){
  clearTimeout(rt);
  rt = setTimeout(resize, 220);
}
window.addEventListener('resize', scheduleResize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 360); });
if(window.visualViewport) window.visualViewport.addEventListener('resize', scheduleResize);

document.addEventListener('visibilitychange', function(){
  if(document.hidden){ if(raf) cancelAnimationFrame(raf); raf = 0; }
  else if(!raf){ lastT = 0; raf = requestAnimationFrame(frame); }
});
window.addEventListener('pageshow', function(){ if(!raf){ lastT = 0; raf = requestAnimationFrame(frame); } });

function loadStarry(){
  if(!window.STARRY_IMG) return false;
  var im = new Image();
  im.onload = function(){
    imgEl = im;
    IMG_MODE = true;
    resize();
  };
  im.onerror = function(){
    resize();
  };
  im.src = window.STARRY_IMG;
  return true;
}

if(!loadStarry()){
  resize();
}
loadMusic();
raf = requestAnimationFrame(frame);

})();
</script>
